name: MedAssist CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:

  # ─────────────────────────────────────────────
  # Job 1 — Code Quality (warnings only, never fails)
  # ─────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8

      - name: Lint with flake8 (warnings only)
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=venv,medassist_env,.git,__pycache__,models,data/faiss_index \
            --ignore=E501,W503,E203,W291,W293,W292,E302,E303,E305 \
            --exit-zero

  # ─────────────────────────────────────────────
  # Job 2 — Install & Import Tests
  # ─────────────────────────────────────────────
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify core imports
        run: |
          python -c "
          import sys
          print(f'Python: {sys.version}')

          import langchain
          print(f'LangChain     : {langchain.__version__}')

          import langgraph
          from importlib.metadata import version
          print(f'LangGraph     : {version(\"langgraph\")}')

          import langchain_groq
          print(f'LangChain-Groq: OK')

          import faiss
          print(f'FAISS         : OK')

          import sentence_transformers
          print(f'SentenceTransformers: {sentence_transformers.__version__}')

          import xgboost
          print(f'XGBoost       : {xgboost.__version__}')

          import shap
          print(f'SHAP          : {shap.__version__}')

          import streamlit
          print(f'Streamlit     : {streamlit.__version__}')

          import pandas, numpy
          print(f'Pandas        : {pandas.__version__}')
          print(f'NumPy         : {numpy.__version__}')

          print()
          print('All imports successful!')
          "

      - name: Test risk scorer
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from utils.risk_scorer import RiskScorer
          scorer = RiskScorer()
          text = 'RED FLAGS:\n- Chest pain\nURGENCY: EMERGENCY\nCONFIDENCE: 0.9'
          result = scorer.parse_and_score(text)
          assert 'risk_score' in result
          print(f'RiskScorer OK — score: {result[\"risk_score\"]}')
          "

      - name: Test disease classifier (no model file needed)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from utils.disease_classifier import DiseaseClassifier
          clf = DiseaseClassifier()
          result = clf.predict('chest pain shortness of breath')
          assert 'classifier_available' in result
          print(f'DiseaseClassifier OK — available: {result[\"classifier_available\"]}')
          "

      - name: Test LangGraph pipeline compiles
        env:
          GROQ_API_KEY: "dummy_key_for_ci_test"
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.environ['GROQ_API_KEY'] = 'dummy_key_for_ci_test'
          from agents.clinical_agent import build_clinical_graph
          graph = build_clinical_graph()
          print(f'LangGraph pipeline compiled OK — {type(graph).__name__}')
          "

  # ─────────────────────────────────────────────
  # Job 3 — Security Scan
  # ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          bandit -r . \
            --exclude ./venv,./medassist_env,./.git,./models \
            -ll \
            --quiet \
            --exit-zero

      - name: Check for hardcoded secrets
        run: |
          python -c "
          import os, re, sys

          patterns = [
              r'gsk_[A-Za-z0-9]{40,}',
              r'sk-[A-Za-z0-9]{40,}',
              r'ghp_[A-Za-z0-9]{36,}',
          ]

          found = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in
                        ['venv', 'medassist_env', '.git', '__pycache__',
                         'models', 'faiss_index', '.github']]
              for fname in files:
                  if not fname.endswith('.py'):
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      content = open(fpath).read()
                      for p in patterns:
                          if re.search(p, content):
                              found.append(fpath)
                  except Exception:
                      pass

          if found:
              print('WARNING: Possible secrets in:', found)
              sys.exit(1)
          else:
              print('No hardcoded secrets found!')
          "

  # ─────────────────────────────────────────────
  # Job 4 — Deploy Notification
  # ─────────────────────────────────────────────
  notify:
    name: Deploy Ready
    runs-on: ubuntu-latest
    needs: [ test, security ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Print deployment summary
        run: |
          echo "============================================"
          echo "  MedAssist CI/CD — All checks passed!"
          echo "============================================"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Author  : ${{ github.actor }}"
          echo ""
          echo "  Code Quality  "
          echo "  Import Tests  "
          echo "  Unit Tests    "
          echo "  Security Scan "
          echo ""
          echo "  Streamlit Cloud auto-deploys from main"
          echo "============================================"
